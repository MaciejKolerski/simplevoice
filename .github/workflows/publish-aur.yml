name: "publish AUR"

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Existing GitHub release tag, for example v0.1.9"
        required: true
        type: string
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release tag to publish, for example v0.1.9"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-aur-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: simplevoice-bin
            pkgbuild: ./aur/simplevoice-bin/PKGBUILD
            assets: ./aur/simplevoice-bin/simplevoice-bin.install
            source_kind: deb
          - package: simplevoice
            pkgbuild: ./aur/simplevoice/PKGBUILD
            assets: ./aur/simplevoice/simplevoice.install
            source_kind: source
    env:
      AUR_MAINTAINER_NAME: "Woro"
      AUR_MAINTAINER_EMAIL: "woro@tanieddosy.pl"

    steps:
      - name: Validate the release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v0.1.9; got: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out the released source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Verify the tagged version
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          package_version=$(jq -r .version package.json)
          tauri_version=$(jq -r .version src-tauri/tauri.conf.json)
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          if [[ "$VERSION" != "$package_version" || "$VERSION" != "$tauri_version" || "$VERSION" != "$cargo_version" ]]; then
            printf 'Tag version %s does not match package.json=%s, tauri.conf.json=%s, Cargo.toml=%s\n' \
              "$VERSION" "$package_version" "$tauri_version" "$cargo_version" >&2
            exit 1
          fi

      - name: Prepare ${{ matrix.package }}
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_KIND: ${{ matrix.source_kind }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE_KIND" == "deb" ]]; then
            url="https://github.com/MaciejKolerski/simplevoice/releases/download/v${VERSION}/Simplevoice_${VERSION}_amd64.deb"
            archive="$RUNNER_TEMP/Simplevoice_${VERSION}_amd64.deb"
            checksum_key=sha256sums_x86_64
          else
            url="https://github.com/MaciejKolerski/simplevoice/archive/refs/tags/v${VERSION}.tar.gz"
            archive="$RUNNER_TEMP/simplevoice-${VERSION}.tar.gz"
            checksum_key=sha256sums
          fi

          curl --fail --location --retry 4 --retry-all-errors --output "$archive" "$url"
          checksum=$(sha256sum "$archive" | cut -d' ' -f1)

          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" "aur/${PACKAGE}/PKGBUILD"
          sed -i "s/^pkgrel=.*/pkgrel=1/" "aur/${PACKAGE}/PKGBUILD"
          sed -i "s/^${checksum_key}=.*/${checksum_key}=('${checksum}')/" "aur/${PACKAGE}/PKGBUILD"

      # AUR maintenance windows should not make an entire release permanently
      # stale. Try three times; a manual workflow_dispatch remains the fallback.
      - name: Publish to AUR (attempt 1)
        id: publish_1
        continue-on-error: true
        # KSXGitHub/github-actions-deploy-aur v4.2.0
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050
        with:
          pkgname: ${{ matrix.package }}
          pkgbuild: ${{ matrix.pkgbuild }}
          assets: ${{ matrix.assets }}
          commit_username: ${{ env.AUR_MAINTAINER_NAME }}
          commit_email: ${{ env.AUR_MAINTAINER_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.release.outputs.version }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Wait before retry 2
        if: steps.publish_1.outcome == 'failure'
        run: sleep 30

      - name: Publish to AUR (attempt 2)
        id: publish_2
        if: steps.publish_1.outcome == 'failure'
        continue-on-error: true
        # KSXGitHub/github-actions-deploy-aur v4.2.0
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050
        with:
          pkgname: ${{ matrix.package }}
          pkgbuild: ${{ matrix.pkgbuild }}
          assets: ${{ matrix.assets }}
          commit_username: ${{ env.AUR_MAINTAINER_NAME }}
          commit_email: ${{ env.AUR_MAINTAINER_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.release.outputs.version }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Wait before retry 3
        if: steps.publish_1.outcome == 'failure' && steps.publish_2.outcome == 'failure'
        run: sleep 60

      - name: Publish to AUR (attempt 3)
        if: steps.publish_1.outcome == 'failure' && steps.publish_2.outcome == 'failure'
        # KSXGitHub/github-actions-deploy-aur v4.2.0
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050
        with:
          pkgname: ${{ matrix.package }}
          pkgbuild: ${{ matrix.pkgbuild }}
          assets: ${{ matrix.assets }}
          commit_username: ${{ env.AUR_MAINTAINER_NAME }}
          commit_email: ${{ env.AUR_MAINTAINER_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.release.outputs.version }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519

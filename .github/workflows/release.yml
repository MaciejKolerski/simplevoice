name: "publish"

on:
  push:
    tags:
      - "v*" # Triggers on tags starting with 'v', e.g., v0.2.0

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-15-intel" # Intel Mac (native x86_64; macos-13 was retired Dec 2025)
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # Linux
            target: ""
            args: ""
          - platform: "windows-latest" # Windows
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Tauri base deps + this app's extras: ALSA (cpal capture) and Vulkan.
      # The whisper-rs `vulkan` feature compiles shaders with `glslc`, which is
      # not in the Ubuntu 22.04 repos, so pull the Vulkan SDK (headers + loader
      # + glslc) from LunarG instead.
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            vulkan-sdk

      # The `pnpm tauri` wrapper (scripts/tauri.js) redirects the Cargo target dir
      # to a short path on Windows (260-char limit + static CRT for sherpa-onnx).
      # Mirror it here so tauri-action looks in the same place for the bundles.
      - name: configure windows build (windows only)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: echo 'CARGO_TARGET_DIR=C:\t\sv' >> "$GITHUB_ENV"

      - name: install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code signing + notarization. Unsigned macOS builds carry only
          # the linker's ad-hoc signature, which Gatekeeper reports to users as
          # "Simplevoice is damaged and can't be opened". Given APPLE_CERTIFICATE,
          # tauri-action provisions a throwaway keychain, signs with the Hardened
          # Runtime plus Entitlements.plist, notarizes and staples the ticket.
          # Ignored on the Linux and Windows runners.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # Reuse scripts/tauri.js so Windows gets its static-CRT / target-dir
          # fixes (no-op passthrough on macOS and Linux).
          tauriScript: pnpm tauri
          tagName: v__VERSION__ # This automatically extracts the version from tauri.conf.json
          releaseName: "v__VERSION__"
          releaseBody: "See the assets to download this version."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # Keep AUR publishing separately runnable, so a temporary AUR outage can be
  # retried without rebuilding every Tauri bundle.
  publish-aur:
    needs: publish-tauri
    uses: ./.github/workflows/publish-aur.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  # The first Flathub submission is reviewed manually. Once its dedicated
  # repository exists and FLATHUB_TOKEN is configured, every successful release
  # asks that repository's maintenance workflow to prepare an update PR.
  notify-flathub:
    needs: publish-tauri
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      FLATHUB_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
    steps:
      - name: Flathub is not connected yet
        if: env.FLATHUB_TOKEN == ''
        run: echo "Skipping Flathub notification until FLATHUB_TOKEN is configured."

      - name: Trigger the Flathub update workflow
        if: env.FLATHUB_TOKEN != ''
        # peter-evans/repository-dispatch v4.0.1
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697
        with:
          token: ${{ env.FLATHUB_TOKEN }}
          repository: flathub/io.github.MaciejKolerski.simplevoice
          event-type: simplevoice-release
          client-payload: '{"tag":"${{ github.ref_name }}","commit":"${{ github.sha }}"}'

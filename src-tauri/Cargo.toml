[package]
name = "simplevoice"
version = "0.2.1"
description = "Privacy-first, local & offline Speech-to-Text and voice typing for the desktop."
authors = ["WoroWoro"]
edition = "2021"
rust-version = "1.94.1"
license = "Apache-2.0"
repository = "https://github.com/MaciejKolerski/simplevoice"
default-run = "simplevoice"



[lib]
# The library and binary need distinct names on Windows (rust-lang/cargo#8519).
name = "simplevoice_app_lib"
# Desktop binaries consume the rlib without a standalone archive of all dependencies.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
cpal = "0.15"
ringbuf = "0.4"
rubato = "0.16.2"
hound = "3.5"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
futures = "0.3"
aws-sdk-transcribe = "1.114.0"
aws-sdk-transcribestreaming = "1.115.0"
jsonwebtoken = "9.3.1"
sha2 = "0.10"
num_cpus = "1.16"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
whisper-rs = { version = "0.16.0", default-features = false }
reqwest = { version = "0.12", features = ["json", "multipart"] }
keyring = "2.1"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-native-tls", "migrate"] }
tokio = { version = "1.52.3", features = ["full"] }
enigo = "0.6.1"
tauri-plugin-autostart = "2.5.1"
arboard = "3"
tauri-plugin-dialog = "2.7.1"
crossbeam-channel = "0.5"
thiserror = "2.0"
anyhow = "1.0"
rodio = { version = "0.20", features = ["symphonia-all"] }
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }
sherpa-onnx = { version = "1.13.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = "0.0.1"
core-graphics = "0.25.0"
media-remote = "0.3.7"
whisper-rs = { version = "0.16.0", features = ["metal"] }
objc2 = "0.6.4"
# Keep the App Nap activity APIs available if Foundation defaults are disabled.
objc2-foundation = { version = "0.3.2", features = ["NSProcessInfo", "NSString"] }
# CGRect/CGPoint encoding is required to position macOS window buttons.
objc2-core-foundation = "0.3.2"
candle-core = { version = "0.8", optional = true, features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
whisper-rs = { version = "0.16.0", default-features = false, features = ["vulkan"] }
# Native Wayland keyboard injection without an external executable.
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
libc = "0.2"
# Enable clipboard access through the native Wayland data-control protocol.
arboard = { version = "3", features = ["wayland-data-control"] }
# Read evdev events without changing compositor keybindings.
evdev = "0.13"
# Use the session bus for MPRIS2 without spawning dbus-send or playerctl.
zbus = "5.15.0"

[target.'cfg(target_os = "windows")'.dependencies]
whisper-rs = { version = "0.16.0", default-features = false }

[features]
default = ["candle", "onnx"]
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]
onnx = ["dep:sherpa-onnx"]

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
